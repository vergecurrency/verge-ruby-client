name: Test and Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Ruby client test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler: '4.0.17'
          bundler-cache: true

      - name: Run Rubocop (Linting)
        id: lint
        continue-on-error: true
        run: bundle exec rubocop 2>&1 | tee rubocop-results.txt

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: bundle exec rake spec 2>&1 | tee rspec-results.txt

      - name: Publish test and lint summary
        if: always()
        run: |
          {
            echo "## Ruby client test and lint"
            echo
            echo "- Ruby: \`$(ruby --version)\`"
            echo "- Bundler: \`$(bundle --version)\`"
            echo
            echo "### RuboCop"
            echo '```text'
            if test -f rubocop-results.txt; then
              cat rubocop-results.txt
            else
              echo "RuboCop did not produce results."
            fi
            echo '```'
            echo
            echo "### RSpec"
            echo '```text'
            if test -f rspec-results.txt; then
              cat rspec-results.txt
            else
              echo "RSpec did not produce results."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when test or lint failed
        if: steps.lint.outcome == 'failure' || steps.unit_tests.outcome == 'failure'
        run: exit 1
