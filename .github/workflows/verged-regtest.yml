name: Live verged regtest

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERGE_VERSION: v26.7
  VERGE_ARCHIVE: verge-ubuntu24-appimages.zip
  VERGE_ARCHIVE_SHA256: f1476ac7e5a5d5ccfac1d2c79104c4cf4cf62de979e45448c33d180dfee34799
  VERGE_RPC_HOST: 127.0.0.1
  VERGE_RPC_PORT: '18443'
  VERGE_RPC_USER: verge-ruby
  VERGE_RPC_PASSWORD: verge-ruby-regtest

jobs:
  regtest:
    name: Verge daemon live RPC test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler: '4.0.17'
          bundler-cache: true

      - name: Download Verge Core
        run: |
          curl --fail --location --retry 3 \
            --output "$VERGE_ARCHIVE" \
            "https://github.com/vergecurrency/verge/releases/download/$VERGE_VERSION/$VERGE_ARCHIVE"
          echo "$VERGE_ARCHIVE_SHA256  $VERGE_ARCHIVE" | sha256sum --check

      - name: Extract verged AppImage
        run: |
          unzip -j "$VERGE_ARCHIVE" verged-x86_64.AppImage
          chmod +x verged-x86_64.AppImage
          ./verged-x86_64.AppImage --appimage-extract >/dev/null
          mv squashfs-root verged-appimage

      - name: Start verged in regtest
        run: |
          mkdir -p "$RUNNER_TEMP/verge-regtest"
          nohup ./verged-appimage/AppRun \
            -regtest \
            -server=1 \
            -listen=0 \
            -dnsseed=0 \
            -discover=0 \
            -without-tor \
            -datadir="$RUNNER_TEMP/verge-regtest" \
            -rpcbind="$VERGE_RPC_HOST" \
            -rpcport="$VERGE_RPC_PORT" \
            -rpcuser="$VERGE_RPC_USER" \
            -rpcpassword="$VERGE_RPC_PASSWORD" \
            >"$RUNNER_TEMP/verged.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/verged.pid"

          for attempt in {1..60}; do
            if curl --silent --fail \
              --user "$VERGE_RPC_USER:$VERGE_RPC_PASSWORD" \
              --header 'content-type: application/json' \
              --data '{"jsonrpc":"1.0","id":"ready","method":"getblockchaininfo","params":[]}' \
              "http://$VERGE_RPC_HOST:$VERGE_RPC_PORT/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/verged.log"
          exit 1

      - name: Test client against live verged
        id: live_tests
        continue-on-error: true
        env:
          LIVE_VERGED: '1'
        run: bundle exec rspec spec/live_regtest_spec.rb 2>&1 | tee live-rpc-results.txt

      - name: Capture live daemon RPC status
        if: always()
        continue-on-error: true
        run: |
          curl --silent --show-error \
            --user "$VERGE_RPC_USER:$VERGE_RPC_PASSWORD" \
            --header 'content-type: application/json' \
            --data '{"jsonrpc":"1.0","id":"summary","method":"getblockchaininfo","params":[]}' \
            "http://$VERGE_RPC_HOST:$VERGE_RPC_PORT/" \
            > live-daemon-rpc.json

      - name: Publish live RPC test summary
        if: always()
        run: |
          {
            echo "## Verge Core $VERGE_VERSION live regtest"
            echo
            echo "- Ruby: \`$(ruby --version)\`"
            echo "- Daemon artifact: \`$VERGE_ARCHIVE\`"
            echo "- Network: \`regtest\`"
            echo "- RPC endpoint: \`$VERGE_RPC_HOST:$VERGE_RPC_PORT\`"
            echo
            echo "### Ruby client RPC tests"
            echo '```text'
            if test -f live-rpc-results.txt; then
              cat live-rpc-results.txt
            else
              echo "Live RPC tests did not produce results."
            fi
            echo '```'
            echo
            echo "### Live verged response"
            echo '```json'
            if test -s live-daemon-rpc.json; then
              python3 -m json.tool live-daemon-rpc.json || cat live-daemon-rpc.json
            else
              echo '{"error":"verged did not return an RPC status"}'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when live RPC tests failed
        if: steps.live_tests.outcome == 'failure'
        run: exit 1

      - name: Show daemon log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/verged.log"

      - name: Stop verged
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/verged.pid"; then
            kill "$(cat "$RUNNER_TEMP/verged.pid")" 2>/dev/null || true
          fi
